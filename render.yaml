databases:
  - name: adhi-portfolio-db
    databaseName: adhi_portfolio
    user: adhi_user
    plan: free

services:
  - type: web
    name: adhi-portfolio
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: adhi-portfolio-db
          property: connectionString
      - key: JWT_SECRET
        sync: false

